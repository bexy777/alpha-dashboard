name: alpha-grok scan

# Standalone scanner in this public repo (feed-only, no Discord):
# deterministic 0-token ddgs scan every 2h on GitHub-hosted runners
# (~12 runs/day x ~4 min = ~48 min/day, well under the 2000 min/month free tier).
# Writes feed.json + data/sent.json back to this repo.
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-grok-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanner deps
        run: pip install ddgs

      - name: Scan
        run: python3 scan_actions.py

      - name: Commit feed + sent-list
        run: |
          git config user.name "alpha-grok-bot"
          git config user.email "alpha-grok-bot@users.noreply.github.com"
          git add feed.json data/sent.json
          git diff --cached --quiet || git commit -m "scan: update feed + sent-list [skip ci]"
          git pull --rebase origin main
          git push
