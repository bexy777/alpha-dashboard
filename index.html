<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ALPHA — Garapan Terbaru</title>
<meta name="description" content="Log temuan terbaru agent: project NFT yang WL-nya baru buka, dari akun resmi project.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --row: #14171d;
    --row-hover: #171b22;
    --line: #23272f;
    --line-hover: #2e3542;
    --paper: #edeff3;
    --muted: #8a919e;
    --blue: #5b9bd5;
    --blue-dim: #3e6e9e;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--paper);
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 15px;
    line-height: 1.55;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
  .skip {
    position: absolute; left: -999px; top: 0;
    background: var(--blue); color: #000; padding: 10px 14px;
    font-weight: 600; border-radius: 0 0 8px 0; z-index: 10;
  }
  .skip:focus { left: 0; }
  main { max-width: 760px; margin: 0 auto; }

  header { padding: 12px 2px 18px; border-bottom: 1px solid var(--line); }
  .wordmark {
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 900; font-stretch: 125%;
    font-size: clamp(40px, 10vw, 56px);
    line-height: 1; letter-spacing: -0.02em;
    margin: 0; color: var(--paper);
  }
  .wordmark em { font-style: normal; color: var(--blue); }
  .lede { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
  .status {
    margin: 12px 0 0; color: var(--muted); font-size: 12.5px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--blue); flex: none;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

  .filters {
    display: flex; margin: 18px 0 14px;
    border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; background: var(--row);
  }
  .filters button {
    flex: 1; min-height: 44px; padding: 10px 6px;
    background: transparent; border: 0; cursor: pointer;
    color: var(--muted); font: inherit; font-size: 12.5px;
    border-right: 1px solid var(--line);
  }
  .filters button:last-child { border-right: 0; }
  .filters button[aria-pressed="true"] { background: #1a2333; color: var(--blue); font-weight: 600; }

  .feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .row {
    background: var(--row);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 18px;
    transition: border-color .15s ease, background .15s ease;
  }
  .row:hover { background: var(--row-hover); border-color: var(--line-hover); }
  .row.fresh { animation: flash 1.2s ease-out 1; }
  @keyframes flash { from { border-color: var(--blue); } to { border-color: var(--line); } }
  @media (prefers-reduced-motion: reduce) { .row.fresh { animation: none; } }
  .line1 { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .rank {
    color: var(--blue); font-weight: 600; font-size: 15px;
    min-width: 28px; flex: none; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .src { color: var(--muted); }
  .who .sep { color: var(--muted); }
  .who .proj { color: var(--paper); font-weight: 600; }
  .who a.proj:hover { color: var(--blue); }
  .meta { margin-left: auto; flex: none; display: flex; align-items: baseline; gap: 10px; }
  .tag { color: var(--blue); font-size: 11px; font-weight: 600; letter-spacing: .04em; }
  .age { color: var(--blue); font-size: 13px; font-variant-numeric: tabular-nums; }
  .age.stale { color: var(--blue-dim); }
  .note {
    margin: 8px 0 0 40px; color: var(--muted);
    font-size: 12.5px; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .note a { color: var(--blue); }

  .empty { padding: 36px 8px; text-align: left; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
  .empty strong { color: var(--paper); font-weight: 600; }
  footer { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.7; }
  code { color: var(--paper); }
  @media (max-width: 480px) {
    .rank { min-width: 22px; }
    .note { margin-left: 34px; }
    .tag { display: none; }
  }
</style>
</head>
<body>
<a class="skip" href="#feed">Lewati ke daftar</a>
<main>
  <header>
    <h1 class="wordmark">ALPHA<em>.</em></h1>
    <p class="lede">Log temuan terbaru agent — project NFT yang WL-nya baru buka, dari akun resmi project.</p>
    <p class="status"><span class="dot" aria-hidden="true"></span><span id="feed-status" aria-live="polite">Memuat feed…</span></p>
  </header>

  <div class="filters" role="group" aria-label="Filter sumber">
    <button type="button" data-filter="all" aria-pressed="true">Semua</button>
    <button type="button" data-filter="alpha-grok" aria-pressed="false">alpha-grok</button>
    <button type="button" data-filter="alpha-nft" aria-pressed="false">alpha-nft</button>
    <button type="button" data-filter="alpha-project" aria-pressed="false">alpha-project</button>
  </div>

  <ul class="feed" id="feed"></ul>

  <footer>DYOR — semua baris di sini hasil scan agent, bukan ajakan beli atau mint. Feed ditulis scanner GitHub Actions di repo ini tiap selesai scan, dibaca dari <code>feed.json</code>.</footer>
</main>
<script>
const FEED_URL = 'feed.json';
const seen = new Set();
let activeFilter = location.hash ? location.hash.slice(1) : 'all';
if (!['all', 'alpha-grok', 'alpha-nft', 'alpha-project'].includes(activeFilter)) activeFilter = 'all';

function ageLabel(iso) {
  const t = new Date(iso).getTime();
  if (isNaN(t)) return '—';
  const m = Math.max(0, Math.floor((Date.now() - t) / 60000));
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'j ' + (m % 60) + 'm';
  return Math.floor(h / 24) + 'h';
}
function isStale(iso) {
  const t = new Date(iso).getTime();
  return !isNaN(t) && (Date.now() - t) > 6 * 3600 * 1000;
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function render(items) {
  const list = document.getElementById('feed');
  const filtered = items.filter(it => activeFilter === 'all' || it.source === activeFilter);
  if (!filtered.length) {
    list.innerHTML = '<li class="empty"><strong>Belum ada garapan terbaru.</strong><br>Scanner jalan tiap 2 jam. Begitu ada WL baru dari akun resmi project, barisnya muncul di sini sendiri.</li>';
    return;
  }
  list.innerHTML = filtered.map((it, i) => {
    const fresh = !seen.has(it.id);
    seen.add(it.id);
    const tags = (it.tags || []).join(' ');
    const tagHtml = /AGENTIC/i.test(tags) ? '<span class="tag">AGENTIC BNB</span>' : '';
    const site = it.site_url ? ' <a href="' + esc(it.site_url) + '" target="_blank" rel="noopener">situs ↗</a>' : '';
    return '<li class="row' + (fresh ? ' fresh' : '') + '">' +
      '<div class="line1">' +
        '<span class="rank">' + String(i + 1).padStart(2, '0') + '</span>' +
        '<span class="who"><span class="src">' + esc(it.source || 'alpha') + '</span><span class="sep"> / </span><a class="proj" href="' + esc(it.post_url) + '" target="_blank" rel="noopener">' + esc(it.project || it.handle || '—') + '</a></span>' +
        '<span class="meta">' + tagHtml + '<span class="age' + (isStale(it.found_at) ? ' stale' : '') + '" title="' + esc(fmtTime(it.found_at)) + '">' + esc(ageLabel(it.found_at)) + '</span></span>' +
      '</div>' +
      '<p class="note">' + esc(it.note || 'Detail terbatas.') + site + '</p>' +
    '</li>';
  }).join('');
}

async function load() {
  try {
    const res = await fetch(FEED_URL + '?_=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const items = (data.items || []).slice().sort((a, b) => new Date(b.found_at) - new Date(a.found_at));
    render(items);
    const n = items.length;
    const upd = data.updated_at ? fmtTime(data.updated_at) : 'belum pernah';
    document.getElementById('feed-status').textContent =
      'Temuan terbaru: ' + upd + ' · ' + n + ' temuan' + (activeFilter !== 'all' ? ' · filter: ' + activeFilter : '');
  } catch (e) {
    document.getElementById('feed-status').textContent = 'Feed belum bisa dimuat (' + e.message + '). Coba lagi sebentar lagi.';
    document.getElementById('feed').innerHTML = '<li class="empty"><strong>Feed belum bisa dimuat.</strong><br>Periksa koneksi, lalu muat ulang halaman ini.</li>';
  }
}

document.querySelectorAll('.filters button').forEach(btn => {
  if (btn.dataset.filter === activeFilter) btn.setAttribute('aria-pressed', 'true');
  else btn.setAttribute('aria-pressed', 'false');
  btn.addEventListener('click', () => {
    activeFilter = btn.dataset.filter;
    history.replaceState(null, '', activeFilter === 'all' ? location.pathname : '#' + activeFilter);
    document.querySelectorAll('.filters button').forEach(b =>
      b.setAttribute('aria-pressed', String(b === btn)));
    load();
  });
});

load();
setInterval(load, 60000);
</script>
</body>
</html>
